[package]
name = "rust-cutil"
version = "1.0.25092002"
edition = "2024"
description = "cutil"
documentation = "https://domain.com"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zhrren/rust-cutil"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rust_decimal = { version = "1.37.2", features = ["serde"] }
serde_repr = "0.1.20"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
tokio = { version = "1.46.1", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", features = ["native-tls"] }
tokio-stream = "0.1.17"
futures = "0.3.31"
async-trait = "0.1.88"
dotenv = "0.15.0"
more-di = { version = "3.1.0", features = ["builder", "inject", "async"] }
tracing-subscriber = { version = "0.3.19", features = ["std", "local-time", "fmt", "time"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-error = "0.2.1"
chrono = "0.4.40"
derivative = "2.2.0"
idgenerator-thin = "0.2.1"
time = { version = "0.3.41", features = ["macros", "local-offset", "formatting", "parsing"] }
rand = "0.9.1"
struct-convert = "1.4.0"
actify = "0.6.2"
actix = "0.13.5"
url = "2.5.4"
itertools = "0.13.0"
once_cell = "1.21.3"
regex = "1.11.1"
reqwest = { version = "0.12.20", features = ["json"] }
futures-util = "0.3.31"
anyhow = "1.0.98"
ulid = { version = "1.2.1", features = ["uuid"] }
statum = "0.1.48"
bytes = "1.10.1"
http = "1.3.1"
headers = "0.4.1"
structopt = "0.3.26"

axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["multipart", "typed-header"] }
tower-http = { version = "0.6.6", features = ["cors", "timeout", "trace"] }
sea-orm = { version = "0.12.15", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "debug-print", "with-uuid"] }
rumqttc = "0.24.0"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipauto = "0.2.0"
